# 提交与手动执行都验证同一份规则快照；本流程不发布订阅、不写回仓库。
name: 分流规则验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 固定官方 Action 提交，避免版本标签变化影响验证环境。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: 安装固定测试依赖
        run: python -m pip install -r requirements-test.txt
      - name: 验证边界条件与失败场景
        run: python -m unittest discover -s tests -v
      - name: 下载并核对固定版本的转换器与核心
        shell: bash
        run: |
          python - <<'PY'
          # 下载仅来自官方发布地址，摘要固定在本次验收版本。
          import gzip
          import hashlib
          from pathlib import Path
          import tarfile
          import urllib.request

          root = Path(".validation/tools").resolve()
          root.mkdir(parents=True, exist_ok=True)
          assets = [
              ("https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz",
               "subconverter.tar.gz", "884a6d1168267eba076fcdd5171215bacf98c17948ab526e4cbbdcad5f7a0217"),
              ("https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1-v1.19.30.gz",
               "mihomo.gz", "cbe553d0319a414bd3a372c5976a252155b2c4882b66bce88a4d6bba9571a553"),
          ]
          for url, name, expected in assets:
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("程序归档摘要不符：" + name)
              archive = root / name
              archive.write_bytes(data)
              if name.endswith(".tar.gz"):
                  # data 过滤器阻止归档越过工具目录写入文件。
                  with tarfile.open(archive) as source:
                      source.extractall(root, filter="data")
              else:
                  binary = root / "mihomo"
                  binary.write_bytes(gzip.decompress(data))
                  binary.chmod(0o755)
          PY
      - name: 验证真实转换与核心命中
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_pipeline.py \
            --template config.ini \
            --cases tests/routing_cases.json \
            --subconverter .validation/tools/subconverter/subconverter \
            --mihomo .validation/tools/mihomo \
            --work-dir .validation/pipeline | tee .validation/pipeline-report.json
      - name: 保存验证证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routing-validation
          # 仅包含合成节点及公开规则的验证资料；不接受真实订阅作为 CI 输入。
          path: |
            .validation/pipeline-report.json
            .validation/pipeline/**/sources.json
            .validation/pipeline/**/*.log
          retention-days: 7
          if-no-files-found: ignore
