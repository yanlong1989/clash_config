custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]🇸🇬 狮城节点`[]🚀 手动切换`[]DIRECT
; AI 默认按美/日/新及订阅内顺序故障切换；直接点选真实节点时固定使用该节点。
; 已保存的旧选择可能继续生效，首次启用请在 Ai平台 手动选一次 AI故障切换。
; 手动候选包含全部订阅节点；组内点选节点保持独立，共享手动入口使用全局手动选择。
custom_proxy_group=💬 Ai平台`select`[]🛟 AI故障切换`[]⭐ AI自选节点`[]🚀 手动切换`(?i)(🇺🇸|美国|美國|美西|美东|美東|美中|沪美|滬美|深美|京美|波特兰|波特蘭|达拉斯|達拉斯|俄勒冈|俄勒岡|凤凰城|鳳凰城|费利蒙|費利蒙|硅谷|矽谷|拉斯维加斯|拉斯維加斯|洛杉矶|洛杉磯|圣何塞|聖何塞|圣克拉拉|聖克拉拉|西雅图|西雅圖|芝加哥|(?<![A-Za-z])(?:US|USA|United[ _-]?States|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon[ _-]?Valley|Las[ _-]?Vegas|Los[ _-]?Angeles|San[ _-]?Jose|Santa[ _-]?Clara|Seattle|Chicago)(?![A-Za-z]))`(?i)(🇯🇵|日本|川日|东京|東京|大阪|泉日|埼玉|沪日|滬日|深日|京日|(?<![A-Za-z])(?:JP|Japan|Tokyo|Osaka|Saitama)(?![A-Za-z]))`(?i)(🇸🇬|新加坡|狮城|獅城|沪新|滬新|深新|京新|(?<![A-Za-z])(?:SG|Singapore)(?![A-Za-z]))`.*`[]🚀 节点选择`[]REJECT
; AI 自选独立保存常用节点，包含自动命名的全部订阅节点；在 Ai平台 中选择本组后使用。
custom_proxy_group=⭐ AI自选节点`select`.*
