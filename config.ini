[custom]
; mihomo 订阅转换模板：规则按从上到下的顺序匹配。
; 私有 IP 不主动解析；个人覆盖、AI 专项早于通用服务分类。
; 来源按用途选取；完整性与命中结果由 scripts/validate_rules.py 检查。

; 局域网基础与私网域名优先，避免代理本地服务。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt

; 个人覆盖：继续保留 Google 搜索走 AI、日本专用与通用代理的意图。
ruleset=💬 Ai平台,https://raw.githubusercontent.com/yanlong1989/clash_config/main/rules-ai.list
ruleset=🇯🇵 日本节点,https://raw.githubusercontent.com/yanlong1989/clash_config/main/rules-jp.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/yanlong1989/clash_config/main/rules.list

; 放行必要服务后进行轻量广告拦截。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; AI 必须先于微软、Bing 等大类，防止 Copilot、Azure AI 被提前接管。
ruleset=💬 Ai平台,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.yaml
; 保留原有 AI 源作为补充，避免新主源尚未覆盖的 Azure AI 等域名退回微软大类。
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
