custom_proxy_group=🛟 AI故障切换`fallback`(?i)(🇺🇸|美国|美國|美西|美东|美東|美中|沪美|滬美|深美|京美|波特兰|波特蘭|达拉斯|達拉斯|俄勒冈|俄勒岡|凤凰城|鳳凰城|费利蒙|費利蒙|硅谷|矽谷|拉斯维加斯|拉斯維加斯|洛杉矶|洛杉磯|圣何塞|聖何塞|圣克拉拉|聖克拉拉|西雅图|西雅圖|芝加哥|(?<![A-Za-z])(?:US|USA|United[ _-]?States|Portland|Dallas|Oregon|Phoenix|Fremont|Silicon[ _-]?Valley|Las[ _-]?Vegas|Los[ _-]?Angeles|San[ _-]?Jose|Santa[ _-]?Clara|Seattle|Chicago)(?![A-Za-z]))`(?i)(🇯🇵|日本|川日|东京|東京|大阪|泉日|埼玉|沪日|滬日|深日|京日|(?<![A-Za-z])(?:JP|Japan|Tokyo|Osaka|Saitama)(?![A-Za-z]))`(?i)(🇸🇬|新加坡|狮城|獅城|沪新|滬新|深新|京新|(?<![A-Za-z])(?:SG|Singapore)(?![A-Za-z]))`[]REJECT`http://www.gstatic.com/generate_204`300
